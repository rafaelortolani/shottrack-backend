# SÓ DESENVOLVIMENTO (S21): portas publicadas apenas em 127.0.0.1 e credenciais padrão `shottrack`.
# Produção não usa este arquivo — ver ADR-0018 (perfil prod, variáveis obrigatórias).
services:
  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "127.0.0.1:1025:1025"   # SMTP - a aplicação envia pra cá
      - "127.0.0.1:8025:8025"   # interface web - veja os emails "enviados" aqui

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: shottrack
      POSTGRES_USER: shottrack
      POSTGRES_PASSWORD: shottrack
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shottrack_pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.9.10-management
    ports:
      - "127.0.0.1:5672:5672"    # protocolo AMQP, usado pela aplicação
      - "127.0.0.1:15672:15672"  # painel de administração web
    environment:
      RABBITMQ_DEFAULT_USER: shottrack
      RABBITMQ_DEFAULT_PASS: shottrack

volumes:
  shottrack_pgdata: