services:
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP - a aplicação envia pra cá
      - "8025:8025"   # interface web - veja os emails "enviados" aqui

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shottrack
      POSTGRES_USER: shottrack
      POSTGRES_PASSWORD: shottrack
    ports:
      - "5432:5432"
    volumes:
      - shottrack_pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # protocolo AMQP, usado pela aplicação
      - "15672:15672"  # painel de administração web
    environment:
      RABBITMQ_DEFAULT_USER: shottrack
      RABBITMQ_DEFAULT_PASS: shottrack

volumes:
  shottrack_pgdata: