# Lote 0 (auditoria Q06): os testes NUNCA usam o banco/fila de desenvolvimento. Banco e vhost
# dedicados (criados por scripts/criar-ambiente-de-teste.sh). Não use o shottrack_test: é do E2E
# do front. TestDatabaseGuard recusa subir o contexto apontando para os bancos de dev/E2E.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/shottrack_unit_test}
spring.rabbitmq.virtual-host=${TEST_RABBIT_VHOST:shottrack_unit_test}
# Cada combinação de @TestPropertySource/@MockBean cria um contexto Spring que fica em cache com o seu
# próprio pool — com o pool padrão (10) a suíte estourava o max_connections do Postgres ("too many
# clients already"). Testes são sequenciais: poucas conexões por contexto bastam.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
# ADR-0018: a suíte faz muitos logins/cadastros do mesmo IP — limites altos por
# padrão; os testes de rate limit sobrescrevem com @TestPropertySource.
app.rate-limit.login.attempts=100000
app.rate-limit.login.per-email=100000
app.rate-limit.refresh.attempts=100000
app.rate-limit.password-reset-confirm.attempts=100000
app.rate-limit.password-change.attempts=100000
app.rate-limit.email-change.attempts=100000
app.rate-limit.email-change-confirmation.attempts=100000
app.rate-limit.registration-completion.attempts=100000
app.rate-limit.registration.per-email=100000
app.rate-limit.registration.per-ip=100000
app.rate-limit.password-reset-request.per-email=100000
app.rate-limit.password-reset-request.per-ip=100000
app.rate-limit.account-deletion.attempts=100000
app.rate-limit.data-export.attempts=100000
# ADR-0019: limpeza agendada desligada nos testes (o método é chamado direto)
app.cleanup.enabled=false
