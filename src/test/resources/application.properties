# ADR-0018: a suíte faz muitos logins/cadastros do mesmo IP — limites altos por
# padrão; os testes de rate limit sobrescrevem com @TestPropertySource.
app.rate-limit.login.attempts=100000
app.rate-limit.registration.per-email=100000
app.rate-limit.registration.per-ip=100000
app.rate-limit.password-reset-request.per-email=100000
app.rate-limit.password-reset-request.per-ip=100000
app.rate-limit.account-deletion.attempts=100000
app.rate-limit.data-export.attempts=100000
# ADR-0019: limpeza agendada desligada nos testes (o método é chamado direto)
app.cleanup.enabled=false
