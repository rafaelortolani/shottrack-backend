spring:
  application:
    name: shottrack-backend
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    locale: pt
    locale-resolver: accept-header
  datasource:
    url: jdbc:postgresql://localhost:5432/shottrack
    username: shottrack
    password: shottrack
  jpa:
    hibernate:
      ddl-auto: validate   # schema é sempre via Flyway, nunca auto-gerado
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
