spring:
  application:
    name: shottrack-backend
  autoconfigure:
    # autenticação é toda via JwtAuthenticationFilter (sem UserDetailsService/AuthenticationManager) —
    # sem isso o Spring Boot autoconfigura um usuário em memória com senha aleatória, gerando ruído no log.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    locale: pt
    locale-resolver: accept-header
  datasource:
    url: jdbc:postgresql://localhost:5432/shottrack
    username: shottrack
    password: shottrack
  jpa:
    hibernate:
      ddl-auto: validate   # schema é sempre via Flyway, nunca auto-gerado
    open-in-view: false
  flyway:
    enabled: true
  mail:
    # Mailpit (docker-compose.yml) em desenvolvimento — SMTP fake, sem auth/TLS.
    host: localhost
    port: 1025
  rabbitmq:
    # RabbitMQ (docker-compose.yml, ADR-0015) — fila de recálculo do dashboard.
    host: localhost
    port: 5672
    username: shottrack
    password: shottrack

# ADR-0017 (Onda 1): só /actuator/health exposto (padrão do Actuator), liberado
# sem autenticação no SecurityConfig pro monitor externo de disponibilidade.
management:
  endpoints:
    web:
      exposure:
        include: health

sentry:
  # vazio (dev/testes) = Sentry desligado, sem erro na subida.
  dsn: ${SENTRY_DSN:}
  # ADR-0019: nada de dados pessoais — sem usuário/IP/cabeçalhos/cookies automáticos
  # e sem corpo de requisição nos eventos (SentryPiiScrubber mascara o resto).
  send-default-pii: false
  max-request-body-size: none
  logging:
    # logs ERROR viram evento no Sentry (inclui os 500 do ApiExceptionHandler);
    # WARN e INFO só entram como breadcrumb.
    minimum-event-level: error

server:
  port: 8080
  servlet:
    encoding:
      # sem isso, respostas com acentuação (ex: mensagens de erro, catálogo de
      # armas) não declaram charset no Content-Type — clients estritos (e o
      # MockHttpServletResponse dos testes) caem no default ISO-8859-1.
      charset: UTF-8
      force: true

app:
  # usado pra montar o link de confirmação de cadastro (UC01/ADR-0009)
  # enviado por email — porta padrão do Next.js (shottrack-frontend) em dev.
  frontend-url: http://localhost:3000
  cleanup:
    # ADR-0019: limpeza diária de dados vencidos (ExpiredDataCleanupService)
    enabled: true
    cron: "0 0 3 * * *"   # 03:00 UTC
  legal:
    # ADR-0019: versão vigente dos Termos de Uso/Política de Privacidade, gravada
    # em users.terms_version no aceite (UC23). Mudou o texto → mudar aqui.
    version: "2026-10"
  jwt:
    # obrigatório via env (sem default) — nunca commitar chave de assinatura JWT.
    # gerar uma local com: openssl rand -base64 32
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 60
    refresh-token-expiration-days: 7
  # ADR-0018: rate limit em memória (Bucket4j) em login, cadastro e pedido de
  # redefinição de senha. Excedeu = 429 + Retry-After.
  rate-limit:
    enabled: true
    # só true atrás do proxy de produção — senão X-Forwarded-For é ignorado
    # (qualquer cliente poderia forjá-lo pra furar o limite por IP).
    trust-forwarded-header: false
    login:
      attempts: 10          # por IP + e-mail
      window: 15m
    registration:
      per-email: 5
      per-ip: 20
      window: 1h
    password-reset-request:
      per-email: 5
      per-ip: 20
      window: 1h
    # ADR-0019: por usuário autenticado (ou IP, quando não há usuário)
    account-deletion:
      attempts: 5
      window: 1h
    data-export:
      attempts: 3
      window: 1h
